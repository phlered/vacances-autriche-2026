name: Update site from planning.md

on:
  push:
    paths:
      - 'planning.md'
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Run update script
        run: python3 update-site.py
      
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html planning.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update site from planning.md" && git push)
